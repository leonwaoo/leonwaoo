name: Atualizar cards do perfil

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:           # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cards de estatísticas, linguagens e atividade
        run: python scripts/gerar_cards.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # Opcional: crie o secret PROFILE_TOKEN para contar também contribuições privadas
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Gerar banner, cartão, skills, experiências, certificações, tecnologias e botões
        run: python scripts/gerar_assets.py

      - name: Gerar snake de contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0a6fd6&color_dots=#ebedf0,#bfeaff,#7fe6ff,#1e9bff,#0a6fd6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7fe6ff&color_dots=#161b22,#0a4f9e,#0a6fd6,#1e9bff,#7fe6ff

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
