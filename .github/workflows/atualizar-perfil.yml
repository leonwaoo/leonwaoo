name: Atualizar cards do perfil

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:           # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PALETA: esmeralda              # roxo, esmeralda, ambar, ciano, coral ou lima
      FONTE_TITULO: Press Start 2P   # fontes do Google Fonts
      FONTE_TEXTO: Space Grotesk
      FONTE_CODIGO: VT323
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cards de estatísticas, linguagens e atividade
        run: python scripts/gerar_cards.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # Opcional: crie o secret PROFILE_TOKEN para contar também contribuições privadas
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Gerar banner, cartão, skills, tecnologias, ícones e botões
        run: python scripts/gerar_assets.py

      - name: Gerar snake de contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#059669&color_dots=#ebedf0,#d1fae5,#6ee7b7,#10b981,#047857
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#34d399&color_dots=#161b22,#064e3b,#047857,#10b981,#34d399

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
